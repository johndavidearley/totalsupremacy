[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "total-supremacy-mcp"
version = "0.1.0"
description = "MCP tools for controlling a local Total Supremacy game session"
requires-python = ">=3.10"
dependencies = ["mcp==1.26.0", "anyio>=4.5"]

[project.scripts]
total-supremacy-mcp = "totalsupremacy_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
