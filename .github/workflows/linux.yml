name: Linux build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libglfw3-dev libvulkan-dev ninja-build python3-venv
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install ./tools/mcp
      - name: Configure Release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
